# Server block for nginx-unprivileged (installed as /etc/nginx/conf.d/default.conf).
# TLS and security headers are set by Caddy in front (infra/Caddyfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Hashed build assets never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        access_log off;
        try_files /healthz =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
        try_files /version.json =404;
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    # Prerendered pages are written as <route>.html (trailingSlash 'never').
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
