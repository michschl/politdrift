# Runs on the VPS as /opt/politdrift/compose.yml. IMAGE_TAG comes from /opt/politdrift/.env
# and is changed only by deploy.sh (SSH forced command, KONZEPT 8.4).
name: politdrift

services:
  caddy:
    image: caddy:2.11-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/michschl/politdrift-web:${IMAGE_TAG:?IMAGE_TAG must be set in .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080" # local only, for the health check in deploy.sh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data: {}
  caddy_config: {}
