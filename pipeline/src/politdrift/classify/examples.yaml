- vote:
    business: "25.024"
    title: "Kriegsmaterialgesetzes (Aufnahme einer Abweichungskompetenz für den Bundesrat). Änderung"
    subject: "Vote final"
    meaning_yes: "Adopter le projet"
    meaning_no: "Rejeter le projet"
  answer:
    yes_means: >-
      Der Bundesrat erhält die Kompetenz, bei Kriegsmaterialexporten von den
      Bewilligungskriterien abzuweichen.
    axes:
      - {axis: wirtschaft_liberal, direction: 1, weight: 0.5}
      - {axis: law_order, direction: 1, weight: 0.3}
    topics: [sicherheit_neutralitaet]
    confidence: 0.7
    contested: true
    rationale: >-
      Mehr Spielraum für Rüstungsexporte stärkt die Industrie (liberal) und die
      sicherheitspolitische Handlungsfähigkeit. Aussenpolitik bewusst nicht zugeordnet,
      weil die Lager quer zur Achse offene/geschlossene Aussenpolitik stimmen.

